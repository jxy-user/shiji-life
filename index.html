<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c08f45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="拾己" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="拾己 · LIFE —— 在未完成之城里自由生活，在阶段回顾里认识自己，并把发现带回现实。"
    />
    <title>拾己 · LIFE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker 注册
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[SW] 注册成功:', reg.scope);
              // 检查更新
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // 有新版本可用，通知用户
                      console.log('[SW] 新版本就绪，请刷新');
                      const event = new CustomEvent('sw-update-ready');
                      window.dispatchEvent(event);
                    }
                  });
                }
              });
            })
            .catch(err => console.warn('[SW] 注册失败:', err));
        });
      }
    </script>
  </body>
</html>
