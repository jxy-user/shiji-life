<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="256" fill="#fdfbf6"/>
  <circle cx="256" cy="256" r="240" fill="#f8f2e7" stroke="#e2d3bb" stroke-width="8"/>

  <!-- 微光：发光的小圆 -->
  <defs>
    <radialGradient id="glow" cx="256" cy="256" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 光晕 -->
  <circle cx="256" cy="256" r="80" fill="url(#glow)" filter="url(#softGlow)"/>

  <!-- 城市剪影：简化的建筑轮廓 -->
  <g fill="#2b2621" opacity="0.85">
    <!-- 中央塔 -->
    <path d="M226 320 L226 180 Q256 140 286 180 L286 320 Z"/>
    <rect x="236" y="200" width="40" height="40" rx="4"/>
    <rect x="242" y="250" width="28" height="30" rx="2"/>

    <!-- 左侧建筑群 -->
    <rect x="120" y="280" width="50" height="100" rx="6"/>
    <rect x="130" y="250" width="30" height="30" rx="4"/>
    <rect x="70" y="310" width="40" height="70" rx="4"/>
    <rect x="170" y="290" width="35" height="90" rx="4"/>

    <!-- 右侧建筑群 -->
    <rect x="342" y="280" width="50" height="100" rx="6"/>
    <rect x="352" y="250" width="30" height="30" rx="4"/>
    <rect x="402" y="310" width="40" height="70" rx="4"/>
    <rect x="307" y="290" width="35" height="90" rx="4"/>

    <!-- 前景小元素 -->
    <ellipse cx="256" cy="380" rx="120" ry="20" fill="#2b2621" opacity="0.3"/>
  </g>

  <!-- 底部文字区域留白 -->
  <text x="256" y="460" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="36" font-weight="600" fill="#2b2621" opacity="0.7">
    拾己
  </text>
</svg>