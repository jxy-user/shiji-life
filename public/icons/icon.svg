<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="256" fill="#fdfbf6"/>
  <circle cx="256" cy="256" r="240" fill="#f8f2e7" stroke="#e2d3bb" stroke-width="8"/>

  <!-- 微光：发光的小圆 - 在 safe zone 内 (半径 40% = 204px) -->
  <defs>
    <radialGradient id="glow" cx="256" cy="256" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 光晕 - 居中，在 safe zone 内 -->
  <circle cx="256" cy="256" r="70" fill="url(#glow)" filter="url(#softGlow)"/>

  <!-- 城市剪影：简化的建筑轮廓 - 在 safe zone 内 -->
  <g fill="#2b2621" opacity="0.85">
    <!-- 中央塔 -->
    <path d="M226 310 L226 190 Q256 155 286 190 L286 310 Z"/>
    <rect x="236" y="210" width="40" height="40" rx="4"/>
    <rect x="242" y="260" width="28" height="30" rx="2"/>

    <!-- 左侧建筑群 -->
    <rect x="130" y="270" width="45" height="90" rx="6"/>
    <rect x="135" y="245" width="35" height="25" rx="4"/>
    <rect x="85" y="295" width="35" height="65" rx="4"/>
    <rect x="175" y="280" width="30" height="80" rx="4"/>

    <!-- 右侧建筑群 -->
    <rect x="332" y="270" width="45" height="90" rx="6"/>
    <rect x="337" y="245" width="35" height="25" rx="4"/>
    <rect x="392" y="295" width="35" height="65" rx="4"/>
    <rect x="297" y="280" width="30" height="80" rx="4"/>

    <!-- 前景小元素 -->
    <ellipse cx="256" cy="370" rx="100" ry="18" fill="#2b2621" opacity="0.3"/>
  </g>
</svg>